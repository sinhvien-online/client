name: CI - Next.js Client Service

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test

      - name: Build Next.js
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: https://sinhvien.online
          NEXT_PUBLIC_STRAPI_URL: https://cms.sinhvien.online
          NEXT_PUBLIC_DIRECTUS_URL: https://sub.sinhvien.online
